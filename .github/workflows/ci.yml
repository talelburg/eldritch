name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Builds a release artifact for any branch on demand (`gh workflow run ci
  # --ref <branch>`), so a PR's own sha can go onto the box before merging.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # actions-rust-lang/setup-rust-toolchain reads rust-toolchain.toml and
      # caches ~/.rustup so toolchain isn't re-downloaded on every job.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all --all-features

  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  wasm-build:
    name: wasm-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
      # taiki-e/install-action fetches prebuilt tool binaries with retries
      # and a cargo-binstall fallback, replacing jetli/trunk-action's bare,
      # no-retry GitHub-release download (#196). Version pinned (was
      # `latest`) so behavior is deterministic.
      - name: Install trunk
        uses: taiki-e/install-action@v2.87.30
        with:
          tool: trunk@0.21.14
      - name: Build web crate
        working-directory: crates/web
        # `trunk build` fetches wasm-bindgen + wasm-opt from GitHub releases
        # at build time; a transient release-CDN 504 (#196) must not redden
        # CI. Retry with backoff so an in-run blip is absorbed.
        run: |
          for attempt in 1 2 3; do
            if trunk build --release; then exit 0; fi
            echo "::warning::trunk build attempt ${attempt} failed (transient tool download?); retrying in $((attempt * 15))s"
            sleep "$((attempt * 15))"
          done
          echo "::error::trunk build failed after 3 attempts"
          exit 1

  wasm-test:
    name: wasm-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
      # taiki-e/install-action (retry + binstall fallback, pinned version)
      # replaces jetli/wasm-pack-action's bare GitHub-release download —
      # the wasm-pack fetch that 504'd in #196.
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2.87.30
        with:
          tool: wasm-pack@0.15.0
      - name: Headless wasm tests
        run: wasm-pack test --headless --firefox crates/web

  # The `clippy` job lints the host target, so `#[cfg(target_arch =
  # "wasm32")]` code (the whole transport, the wasm reader, the debug
  # controls, the headless test files) is cfg'd out and never seen. Lint it
  # on the wasm target. Scoped to `web` — `server`/`card-data-pipeline`
  # aren't wasm-safe. The toolchain already has the target + clippy via
  # rust-toolchain.toml.
  wasm-clippy:
    name: wasm-clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p web --all-targets --target wasm32-unknown-unknown --all-features -- -D warnings

  # The deployable build (#1226): the release `server` binary, the release
  # client bundle and the server's migrations, tarred so the binary keeps its
  # executable bit through the artifact zip. `scripts/deploy.sh` fetches it by
  # name. Never on a pull request, and only once all seven jobs are green.
  release:
    name: release
    if: github.event_name != 'pull_request'
    needs: [fmt, clippy, test, doc, wasm-build, wasm-test, wasm-clippy]
    # Pinned to the box's OS: the binary links glibc dynamically (sqlx bundles
    # libsqlite3), so a newer `ubuntu-latest` could build one the box can't run.
    runs-on: ubuntu-24.04
    env:
      # Compiled into both the server and the wasm bundle through
      # `protocol::build_id()`; an unstamped bundle reports "dev" and #583 reads
      # every client as skewed. Set on this job only: workflow-wide, it would
      # rebuild `protocol` and everything above it in every job.
      ELDRITCH_BUILD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        uses: taiki-e/install-action@v2.87.30
        with:
          tool: trunk@0.21.14
      - run: cargo build --release --locked -p server
      - name: Build web crate
        working-directory: crates/web
        # Same retry as `wasm-build`: trunk fetches wasm-bindgen and wasm-opt
        # at build time, and a release-CDN blip must not cost the artifact.
        run: |
          for attempt in 1 2 3; do
            if trunk build --release; then exit 0; fi
            echo "::warning::trunk build attempt ${attempt} failed (transient tool download?); retrying in $((attempt * 15))s"
            sleep "$((attempt * 15))"
          done
          echo "::error::trunk build failed after 3 attempts"
          exit 1
      - name: Package
        run: |
          mkdir -p release
          cp target/release/server release/
          cp -r crates/web/dist release/dist
          cp -r crates/server/migrations release/migrations
          tar -czf "eldritch-${GITHUB_SHA}.tar.gz" -C release .
      - uses: actions/upload-artifact@v7
        with:
          name: eldritch-${{ github.sha }}
          path: eldritch-${{ github.sha }}.tar.gz
          if-no-files-found: error
