[workspace]
resolver = "2"
members = [
    "crates/card-dsl",
    "crates/game-core",
    "crates/cards",
    "crates/scenarios",
    "crates/protocol",
    "crates/server",
    "crates/web",
    "crates/card-data-pipeline",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/talelburg/eldritch"
rust-version = "1.95"

[workspace.lints.rust]
# `forbid`, not `deny`: nothing in the workspace needs unsafe, so no item may opt
# back in with `#[allow(unsafe_code)]`. A future need loosens this here, visibly.
unsafe_code = "forbid"
# Redundant qualification — `foo::Bar` where `Bar` is already in scope. Narrow by
# design: it only fires where the leaf is already imported, so it backstops the
# import standard rather than enforcing it (`docs/agents/standards.md` → Import
# types by full path; reach functions through their parent module).
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Two pedantic lints we deliberately don't enforce — stylistic preferences, not
# a maturity concession: `module_name_repetitions` would force churny renames
# (e.g. `card::CardCode`), and `must_use_candidate` is noise (we hand-apply
# `#[must_use]` where it earns its keep). The doc lints (`missing_errors_doc` /
# `missing_panics_doc`) are enforced — see the `# Errors` / `# Panics` sections.
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Every suppression is an `#[expect(…, reason = "…")]`: an `expect` that stops
# firing fails the build, so a dead suppression can't linger, and the reason
# says why the lint is wrong at that site. `allow_attributes` checks outer
# `#[allow]` only, not inner `#![allow]`; `allow_attributes_without_reason`
# covers both, so an inner `allow` still has to give its reason. The one
# deliberate `allow` (server's shared test module, on each `mod common;`)
# marks itself with `#[expect(clippy::allow_attributes, …)]`.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
