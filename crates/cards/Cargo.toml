[package]
name = "cards"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Eldritch card definitions: hybrid DSL + Rust impls, plus generated metadata from ArkhamDB."

[lints]
workspace = true

[dependencies]
card-dsl = { path = "../card-dsl" }
game-core = { path = "../game-core" }
serde = { version = "1", features = ["derive"] }

[features]
# `TEST_REGISTRY` / `TEST_REGISTRIES`: the real corpus with game-core's
# synthetic test cards composed in, for other crates' tests to name.
test-support = []

[dev-dependencies]
# Installs the card registry before the test harness `main`, so every test in a
# binary sees it installed — no per-test call to forget, no OnceLock race (#473).
ctor = "1.0"
# This crate's own integration tests reach `TEST_REGISTRY` through the feature;
# they don't get the lib's `cfg(test)`, and `required-features` would silently
# skip them under a plain `cargo test -p cards`.
cards = { path = ".", features = ["test-support"] }

