[package]
name = "scenarios"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Eldritch scenario modules and campaign orchestrators."

[lints]
workspace = true

[dependencies]
card-dsl = { path = "../card-dsl" }
game-core = { path = "../game-core" }
cards = { path = "../cards" }

[features]
# `TEST_REGISTRIES`: `cards::TEST_REGISTRY` paired with this crate's scenario
# modules, for scenario tests to name.
test-support = ["cards/test-support"]

[dev-dependencies]
serde_json = "1"
# This crate's own integration tests reach `TEST_REGISTRIES` through the
# feature (see the same line in `cards`).
scenarios = { path = ".", features = ["test-support"] }
