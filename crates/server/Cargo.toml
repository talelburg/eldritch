[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Eldritch server: Axum HTTP + websocket hub, SQLite persistence."

[lints]
workspace = true

[dependencies]
game-core = { path = "../game-core" }
protocol = { path = "../protocol" }
cards = { path = "../cards" }
scenarios = { path = "../scenarios" }
axum = { version = "0.8", features = ["ws"] }
# Session cookies: `CookieJar` reads and sets them. `PrivateCookieJar`
# encrypts the cookie that holds a provider sign-in in flight.
axum-extra = { version = "0.12", features = ["cookie", "cookie-private"] }
# GitHub sign-in. Its default features are reqwest on rustls, so the build
# needs no OpenSSL; its `oauth2::reqwest` re-export is the HTTP client.
oauth2 = "5"
# Google sign-in: OpenID Connect discovery and ID-token verification, on
# `oauth2` 5 with the same default features, so rustls too.
openidconnect = "4"
# The public origin and the redirect URIs built from it.
url = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# A session cookie's `Max-Age`: `axum-extra`'s cookies take a `time::Duration`.
time = "0.3"
tower-http = { version = "0.7", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
# A session id's 256 bits come from the OS RNG; `uuid` v4 carries only 122.
getrandom = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.29"
# Signs the socket tests in through the dev picker over real HTTP. Redirects
# stay unfollowed, so the picker's `Set-Cookie` is read off its own 303.
reqwest = { version = "0.13", default-features = false, features = ["form"] }
