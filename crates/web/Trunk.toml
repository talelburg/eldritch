[build]
target = "index.html"

[serve]
port = 3000
addresses = ["127.0.0.1"]

# Proxy the API + WebSocket to the server during dev. Each entry sits at a
# DISTINCT prefix so trunk's per-entry axum `.nest()` doesn't collide:
# `/games` carries the REST (`POST /games`), `/ws` carries the WebSocket
# upgrade (`/ws/{game_id}` — the reason the WS lives at its own top-level
# route, not under `/games`). Neither is at the root `/`, which trunk 0.21
# panics on. The WS backend MUST use the `ws://` scheme: with `http://`,
# trunk completes the client handshake but fails to open the upstream
# socket (`Url(UnsupportedUrlScheme)`) and the connection dies (close 1006).
[[proxy]]
backend = "http://localhost:8000/games"

[[proxy]]
backend = "ws://localhost:8000/ws"
ws = true

# `/auth` carries sign-in: `/auth/me`, sign-out and the dev picker (with the
# server run as `cargo run -p server -- --dev-auth`). `no_redirect` is what
# makes the dev picker work here: trunk's proxy follows redirects unless told
# not to, so it would follow the picker's `303 Location: /` itself and hand
# the browser the final page without the redirect's `Set-Cookie`. The trunk
# proxy rewrites `Host` to `localhost`, which the dev picker requires.
[[proxy]]
backend = "http://localhost:8000/auth"
no_redirect = true
